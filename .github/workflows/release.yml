name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            artifact: GorodovoyVision-linux-x86_64
          - os: windows-latest
            artifact: GorodovoyVision-windows-x86_64.exe

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install CUDA PyTorch (Linux)
        if: runner.os == 'Linux'
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cu121

      - name: Install CPU PyTorch (Windows)
        if: runner.os == 'Windows'
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Install project and build dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Download YOLO model
        run: |
          python -c "from ultralytics import YOLO; YOLO('yolo26n.pt')"
          python -c "from pathlib import Path; Path('models').mkdir(exist_ok=True); Path('models/yolo26n.pt').write_bytes(Path('yolo26n.pt').read_bytes())"

      - name: Build Linux executable
        if: runner.os == 'Linux'
        run: |
          pyinstaller --noconfirm --clean --console \
            --name GorodovoyVision \
            --hidden-import="uvicorn.logging" \
            --hidden-import="uvicorn.loops" \
            --hidden-import="uvicorn.loops.auto" \
            --hidden-import="uvicorn.protocols" \
            --hidden-import="uvicorn.protocols.http" \
            --hidden-import="uvicorn.protocols.http.auto" \
            --hidden-import="uvicorn.lifespan" \
            --hidden-import="uvicorn.lifespan.on" \
            --collect-submodules torch \
            --collect-submodules torchvision \
            --collect-submodules ultralytics \
            --collect-submodules cv2 \
            --add-data "classes.txt:." \
            --add-data "models/yolo26n.pt:models" \
            app/__main__.py

      - name: Archive Linux build
        if: runner.os == 'Linux'
        run: |
          cd dist/GorodovoyVision
          zip -r ../GorodovoyVision-linux-x86_64.zip .

      - name: Build Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --console `
            --name GorodovoyVision `
            --hidden-import="uvicorn.logging" `
            --hidden-import="uvicorn.loops" `
            --hidden-import="uvicorn.loops.auto" `
            --hidden-import="uvicorn.protocols" `
            --hidden-import="uvicorn.protocols.http" `
            --hidden-import="uvicorn.protocols.http.auto" `
            --hidden-import="uvicorn.lifespan" `
            --hidden-import="uvicorn.lifespan.on" `
            --collect-submodules torch `
            --collect-submodules torchvision `
            --collect-submodules ultralytics `
            --collect-submodules cv2 `
            --add-data "classes.txt;." `
            --add-data "models/yolo26n.pt;models" `
            app/__main__.py

      - name: Rename Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: Copy-Item dist/GorodovoyVision.exe dist/GorodovoyVision-windows-x86_64.exe

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.os }}
          path: |
            dist/GorodovoyVision-linux-x86_64.zip
            dist/GorodovoyVision-windows-x86_64.exe
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-files
          pattern: build-*
          merge-multiple: true

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            release-files/GorodovoyVision-linux-x86_64.zip \
            release-files/GorodovoyVision-windows-x86_64.exe \
            --title "Gorodovoy Vision ${GITHUB_REF_NAME}" \
            --generate-notes