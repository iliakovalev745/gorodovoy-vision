name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            artifact: GorodovoyVision-linux-source
          - os: windows-latest
            artifact: GorodovoyVision-windows-x86_64.exe

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download YOLO model
        run: |
          python -m pip install --upgrade pip
          python -m pip install ultralytics
          python -c "from ultralytics import YOLO; YOLO('yolo26n.pt')"
          python -c "from pathlib import Path; Path('models').mkdir(exist_ok=True); Path('models/yolo26n.pt').write_bytes(Path('yolo26n.pt').read_bytes())"

      # Для Linux упаковываем чистый проект и зависимости в легкий архив (без тяжелого бинарника)
      - name: Package Linux Source & Configs
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          zip -r dist/GorodovoyVision-linux-source.zip app vision models classes.txt config.py requirements.txt .env.example Makefile Dockerfile docker-compose.yml

      # Для Windows собираем .exe через PyInstaller
      - name: Install Windows dependencies & PyInstaller
        if: runner.os == 'Windows'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Build Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --console `
            --name GorodovoyVision `
            --collect-submodules ultralytics `
            --add-data "classes.txt;." `
            --add-data "models/yolo26n.pt;models" `
            app/__main__.py

      - name: Rename Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: Copy-Item dist/GorodovoyVision.exe dist/GorodovoyVision-windows-x86_64.exe

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.os }}
          path: |
            dist/GorodovoyVision-linux-source.zip
            dist/GorodovoyVision-windows-x86_64.exe
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-files
          pattern: build-*
          merge-multiple: true

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            release-files/GorodovoyVision-linux-source.zip \
            release-files/GorodovoyVision-windows-x86_64.exe \
            --title "Gorodovoy Vision ${GITHUB_REF_NAME}" \
            --generate-notes